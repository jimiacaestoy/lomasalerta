<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lomas Alerta Multimedio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABECERA -->
    <header class="cabecera">

        <div class="logo-area">
            <img src="index/logo.png" alt="Lomas Alerta" class="logo">
        </div>

        <div class="menu-area">

            <div class="fecha" id="fechaActual"></div>

            <nav>
                <ul>
                    <li>
                        <a href="servicios-comunidad.html">
                            Servicios a la Comunidad
                        </a>
                    </li>

                    <li>
                        <a href="quienes-somos.html">
                            Quiénes Somos
                        </a>
                    </li>
                </ul>
            </nav>

        </div>

    </header>

    <!-- REDES -->
    <section class="redes">

        <a href="#">
            <img src="index/ico/facebook.png" alt="Facebook">
        </a>

        <a href="#">
            <img src="index/ico/instagram.png" alt="Instagram">
        </a>

        <a href="#">
            <img src="index/ico/tiktok.png" alt="TikTok">
        </a>

        <a href="#">
            <img src="index/ico/kwai.png" alt="Kwai">
        </a>

        <a href="#">
            <img src="index/ico/youtube.png" alt="YouTube">
        </a>

    </section>

    <!-- CONTENIDO -->
    <main class="contenedor-principal">

        <section class="panel">

            <h2>RADIO ONLINE</h2>

            <div class="contenido-panel">
                Reproductor Visual
            </div>

        </section>

        <section class="panel">

            <h2>MAPA DE INSEGURIDAD</h2>

            <div class="contenido-panel">
    <iframe
        src="https://www.google.com/maps/d/embed?mid=1DF8sKdQeiGuLf2vPCZgh5C49P6lV-T0&ehbc=2E312F
"
        width="100%"
        height="100%"
        style="border:0;"
        allowfullscreen=""
        loading="lazy">
    </iframe>
</div>

        </section>

        <section class="panel">

            <h2>MAPA DE BASURALES</h2>

            <div class="contenido-panel">
    <iframe
        src="https://www.google.com/maps/d/embed?mid=1U3RAVDEwcf4F1YH1FjZ_pFm4KKFwi5M&ehbc=2E312F
"
        width="100%"
        height="100%"
        style="border:0;"
        allowfullscreen=""
        loading="lazy">
    </iframe>
            </div>

        </section>

    </main>

    <script>
        const fecha = new Date();

        document.getElementById("fechaActual").innerHTML =
        fecha.toLocaleDateString("es-AR");
    </script>

</body>
</html>
