<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lomas Alerta Multimedio</title>
    <style>
        body { margin: 0; font-family: sans-serif; }

        .cabecera {
            background: linear-gradient(to bottom, #042446, #1869c0);
            color: white;
            padding: 10px;
            position: relative;
            min-height: 120px;
        }

        .btn-menu { color: white !important; margin: 0 3px; text-decoration: none; transition: 0.3s; }
        .btn-menu:hover { text-shadow: 2px 2px 4px rgb(20, 19, 19); }
        .logo-area { position: absolute; top: 10px; left: 10px; }
        .logo-area img { height: 100px; }
        .reloj-area { position: absolute; top: 10px; right: 20px; font-size: 0.9em; }
        .menu-area { text-align: right; margin-top: 98px; }
    
        .redes { background: #e0e0e0; padding: 2px; text-align: center; border-bottom: 2px solid #ccc; }
        .redes img { height: 30px; margin: 0 8px; transition: transform 0.3s ease, filter 0.3s ease; }
        .redes img:hover { transform: scale(0.9); filter: drop-shadow(2px 2px 3px rgba(0, 0, 0, 0.5)); }

        .contenedor-principal { display: flex; flex-wrap: wrap; padding: 20px; gap: 20px; justify-content: flex-start; align-items: flex-start; width: 100%; box-sizing: border-box; }
     
        /* Bloque Fijo del Bunker */
        .panel-radio { width: 338px; }
        .panel-radio h2 { text-align: center; background: #0056b3; color: white; margin: 0; padding: 10px; font-size: 1.2em; border-radius: 10px 10px 0 0; }
        .contenido-radio { height: 600px; width: 338px; position: relative; background: #000; overflow: hidden; }
        #player { position: absolute; top: 0; left: 0; width: 338px; height: 600px; background-image: url('ReproductorVisual/fondo.png'); background-size: cover; background-position: center; }
        #fra0 { position: absolute; top: 0; width: 100%; height: 10%; }
        #btnPlay { position: absolute; bottom: 10px; left: 10px; background: none; border: none; cursor: pointer; padding: 0; }
        #iconPlay { width: 70px; }
        #fra3 { position: absolute; bottom: 20px; right: 20px; display: flex; align-items: center; gap: 8px; }
        #cajonera-redes { display: flex; gap: 8px; }
        #cajonera-redes img { width: 40px; transition: filter 0.3s ease; }
        #cajonera-redes img:hover { filter: brightness(1.2) sepia(0.5); cursor: pointer; }

        /* Bloques Fluidos de Mapas */
        .panel-mapa { flex: 0 0 400px; height: 400px; }
        .panel-mapa h2 { text-align: center; background: #0056b3; color: white; margin: 0; padding: 10px; font-size: 1.2em; border-radius: 10px 10px 0 0; }
        .contenido-mapa { height: calc(100% - 45px); position: relative; }
       
        @media (max-width: 900px) { .panel-radio, .panel-mapa { width: 100%; max-width: 338px; } }
    </style>
</head>
<body>

    <header class="cabecera">
        <div class="logo-area"><img src="index/logo.png" alt="Lomas Alerta"></div>
        <div class="reloj-area">🕒 <span id="horaActual"></span> | 📅 <span id="diaActual"></span></div>
        <div class="menu-area">
            <nav>
                <a href="servicios-comunidad.html" class="btn-menu">Servicios a la Comunidad</a> |
                <a href="quienes-somos.html" class="btn-menu">Quiénes Somos</a>
            </nav>
        </div>
    </header>

    <section class="redes">
        <a href="#"><img src="index/ico/facebook.png" alt="Facebook"></a>
        <a href="#"><img src="index/ico/instagram.png" alt="Instagram"></a>
        <a href="#"><img src="index/ico/tiktok.png" alt="TikTok"></a>
        <a href="#"><img src="index/ico/kwai.png" alt="Kwai"></a>
        <a href="#"><img src="index/ico/youtube.png" alt="YouTube"></a>
    </section>

    <main class="contenedor-principal">
        <section class="panel-radio">
            <h2>RADIO ONLINE</h2>
            <div class="contenido-radio">
                <div id="player">
                    <div id="fra0"></div>
                    <button id="btnPlay"><img id="iconPlay" src="ReproductorVisual/ico/play.png" alt="Play"></button>
                    <div id="fra3">
                        <div id="cajonera-redes">
                            <img src="ReproductorVisual/ico/logoinstagram.png" alt="IG">
                            <img src="ReproductorVisual/ico/logotiktok.png" alt="TT">
                            <img src="ReproductorVisual/ico/logoyoutube.png" alt="YT">
                            <img src="ReproductorVisual/ico/logokwai.png" alt="KW">
                        </div>
                    </div>
                    <audio id="audioPlayer"></audio>
                </div>
            </div>
        </section>

        <section class="panel-mapa">
            <h2>MAPA DE INSEGURIDAD</h2>
            <div class="contenido-mapa"><iframe src="https://www.google.com/maps/d/embed?mid=1DF8sKdQeiGuLf2vPCZgh5C49P6lV-T0" style="width:100%; height:100%; border:0;"></iframe></div>
        </section>

        <section class="panel-mapa">
            <h2>MAPA DE BASURALES</h2>
            <div class="contenido-mapa"><iframe src="https://www.google.com/maps/d/embed?mid=1U3RAVDEwcf4F1YH1FjZ_pFm4KKFwi5M" style="width:100%; height:100%; border:0;"></iframe></div>
        </section>
    </main>

    <script>
        const btnPlay = document.getElementById('btnPlay');
        const iconPlay = document.getElementById('iconPlay');
        const audio = document.getElementById('audioPlayer');

        btnPlay.addEventListener('click', () => {
            if (audio.paused) { audio.play(); iconPlay.src = 'ReproductorVisual/ico/stop.png'; }
            else { audio.pause(); iconPlay.src = 'ReproductorVisual/ico/play.png'; }
        });

        function actualizarReloj() {
            const ahora = new Date();
            document.getElementById("horaActual").innerHTML = ahora.toLocaleTimeString("es-AR", { hour12: false });
            document.getElementById("diaActual").innerHTML = ahora.toLocaleDateString("es-AR");
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();
    </script>
    <script>
    // Bloquear clic derecho
    document.addEventListener('contextmenu', event => event.preventDefault());

    // Bloquear selección de texto
    document.onselectstart = function() { return false; };

    // Bloquear combinación de teclas (Ctrl+U, Ctrl+S, F12) para evitar inspeccionar
    document.onkeydown = function(e) {
        if(e.keyCode == 123 || (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 83 || e.keyCode == 73))) {
            return false;
        }
    }
</script>
    <footer style="text-align: center; padding: 20px; margin-top: 40px; border-top: 1px solid #ccc; font-size: 0.8em; color: #555;">
        <p>&copy; 2026 Lomas Alerta | Jimmy & Alberto®</p>
    </footer>
</body>
</html>
